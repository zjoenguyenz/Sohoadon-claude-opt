# SoHoaDonHarness — target CLI macOS cho cổng tự chạy (LUẬT
# 2026-11-12, SỬA 2026-11-15: >= 10 lượt liên tiếp thành công
# trước giao test — anh bỏ mức 100 vì các lượt 100x cũ đo SAI
# đường đọc; từ G5 harness chạy đúng đường app, xem dưới).
#
# Đặt file này ở harness/project-harness.yml trong repo; các
# đường ../ trỏ về GỐC repo nơi project.yml chính và các file
# nguồn app đang sống (Money.swift ... BenchImages/). Nếu bố
# cục repo lúc đẩy khác, Leader chỉ phải sửa tiền tố đường —
# danh sách FILE giữ nguyên.
#
# Sinh project:  xcodegen generate --spec project-harness.yml
# Build:         xcodebuild -project SoHoaDonHarness.xcodeproj \
#                  -scheme SoHoaDonHarness -configuration Release \
#                  -destination 'platform=macOS' build
name: SoHoaDonHarness
options:
  bundleIdPrefix: com.nje
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  SoHoaDonHarness:
    type: tool
    platform: macOS
    sources:
      # --- File nguồn app NGUYÊN VĂN (cùng tập module đường
      # đọc với hai target iOS — luật một-nguồn của Pha 4).
      # VÀO ĐƯỢC vì chỉ dùng Foundation/CoreGraphics/Vision/
      # ImageIO (đều có trên macOS):
      - ../Money.swift
      - ../ReadDiagnostics.swift
      - ../CaptureIntake.swift
      - ../OCREngine.swift
      - ../LineAssembly.swift
      - ../VendorData.swift
      - ../Parser.swift
      # V4-1 (DESIGN-V4 §2/§3): tầng ứng viên + trọng tài khối
      # tổng — chỉ Foundation, vào harness như mọi module đọc.
      - ../Candidates.swift
      - ../Arbiter.swift
      - ../ItemCandidates.swift
      - ../Reconcile.swift
      - ../RegionReReader.swift
      # G1 (cổng kiểm chứng thật): hai file tầng app THUẦN
      # Foundation vào harness để chế độ `unittests` chạy test
      # vòng đời + logic điều kiện bằng Swift thật:
      # - PendingDraft.swift: DTO + PendingDraftStore — chỉ cần
      #   các kiểu của Parser/Reconcile/ReadDiagnostics (đã có
      #   ở trên), không dính UI/SwiftData.
      # - ReceiptLogic.swift: logic điều kiện thuần tách khỏi
      #   ReceiptViews (canReparse / receiptFlags /
      #   receiptHasOriginalImage) + formatMoney.
      - ../PendingDraft.swift
      - ../ReceiptLogic.swift
      # L-2026-11-20-42: planner kiểm kê ảnh gốc THUẦN
      # Foundation (IntegrityPlanner) — harness biên dịch để
      # test IG01… chạy bằng Swift thật. Phần keo SwiftData/
      # UIKit của file nằm sau #if canImport(UIKit) nên
      # không lọt vào harness macOS.
      - ../ImageIntegrity.swift
      # A1 (vòng 2): planner khôi phục Drive THUẦN Foundation —
      # test RS01… chạy bằng Swift thật.
      - ../RestorePlanner.swift
      # A2 + A3 (vòng 2): lõi xuất THUẦN — test EX01… (ZIP khứ hồi
      # cả bằng /usr/bin/unzip của macOS).
      - ../ExportKit.swift
      # A10 (vòng 2): nét tiệm THUẦN — test ST01…
      - ../StoreTraits.swift
      # G5 (sửa cổng đo — việc gốc của vụ "100 lượt xanh giả"):
      # ReadPipeline.swift NAY VÀO harness. File chỉ chạm UIKit
      # ở 3 điểm (import, uprightCGImage(UIImage),
      # UIDevice.current.model) và cả 3 đã được bọc
      # #if canImport(UIKit) trong chính file nguồn (hành vi
      # iOS không đổi); phần còn lại là Foundation/CoreGraphics/
      # CoreImage/Vision — đều có trên macOS. Nhờ đó chế độ
      # images/roigate của harness chạy ĐÚNG ReceiptReader.read
      # của app (chuỗi ứng viên -> chọn winner -> thu hoạch
      # alternates -> ReadPipeline.run + ROI), thay cho bản tái
      # lập runCandidate cũ gọi thẳng ReceiptParser.parse.
      - ../ReadPipeline.swift
      # PHA 2 (L-2026-11-21-47): lõi hạ cánh bằng thuế THUẦN +
      # bảng hạt giống — harness biên dịch để kiểm thử TL01–TL13
      # bằng Swift thật và chạy hạ cánh trên đường images/roigate
      # với ngữ cảnh hạt giống (không hồ sơ tiệm).
      - ../TaxLanding.swift
      - ../TaxSeed.swift
      # --- Driver + shim của harness (thư mục này):
      - HarnessApp
      # KHÔNG VÀO (và vì sao):
      # - Models.swift / ScanView / ReceiptViews / ContentView /
      #   HomeView / CardsView / SoHoaDonApp / BenchApp /
      #   BenchView: SwiftUI/SwiftData/UIKit — tầng app, ngoài
      #   phạm vi đường đọc.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nje.sohoadon.harness
        # vendors.json + lexicon.json: KHÔNG nhúng vào tool —
        # workflow chép hai file cạnh binary sau build
        # (Bundle.main của CLI = thư mục chứa executable;
        # driver fail-closed nếu dataVersion == "unloaded").
