name: SoHoaDon
options:
  bundleIdPrefix: com.nje
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  SoHoaDon:
    type: application
    platform: iOS
    sources:
      # --- Tầng app (giữ nguyên từ main) ---
      - SoHoaDonApp.swift
      - Models.swift
      - ContentView.swift
      - HomeView.swift
      - ScanView.swift
      # P-DRAFT (L-2026-11-13-14): DTO + kho lưu bản chụp nháp —
      # chỉ target app (tầng UI dùng); bench không nạp file này.
      - PendingDraft.swift
      - ReceiptViews.swift
      # G1: logic điều kiện thuần tách khỏi ReceiptViews (chỉ
      # Foundation) — target app dùng qua tầng bọc; harness cũng
      # biên dịch file này để chạy cổng unittests bằng Swift thật.
      # Chỉ target chính: bench không cần (không file bench nào
      # gọi các hàm này).
      - ReceiptLogic.swift
      # P2-1: lớp gương thư mục Files (§2.2) — DTO Codable +
      # engine đối chiếu manifest + bộ chọn thư mục cấp thấp.
      # Chỉ target chính như ReceiptLogic: bench không có tầng
      # model/UI nên không liên kết file này.
      - MirrorSync.swift
      # S1+S2 (gói camera tự dựng, SCAN-CARD-AUDIT mục 2.5):
      # camera quét tự dựng kiểu Lens + bản scan phẳng lưu kèm
      # ảnh gốc theo quy ước tên file (không đổi model). Chỉ
      # target chính như MirrorSync — bench không có tầng
      # camera/UI nên không liên kết hai file này.
      - ScanCameraView.swift
      - FlatScan.swift
      # LOGKIT (L-2026-11-19-39): bộ log chẩn đoán trong app —
      # luật cứng 2026-11-18 (mọi app phải có đường lấy log
      # ra). Chỉ target chính như MirrorSync: bench không
      # liên kết (bench có màn thám tử picker tự chứa trong
      # BenchView.swift).
      - Diagnostics.swift
      # P2-2: đồng bộ Google Drive (§2.3) — OAuth + PKCE qua
      # ASWebAuthenticationSession, token ở Keychain, engine
      # đối chiếu manifest dùng CHUNG DTO/manifest với lớp
      # gương. Chỉ target chính như MirrorSync — bench không
      # có tầng model/UI nên không liên kết file này.
      - DriveSync.swift
      # A1 (vòng 2): đường kéo về từ Drive — planner thuần (harness
      # cũng biên dịch) + engine/màn hình (chỉ target app).
      - RestorePlanner.swift
      - DriveRestore.swift
      # A2 + A3 (vòng 2): lõi xuất thuần (ZIP/CSV/phép tính Báo
      # Cáo — harness cũng biên dịch) + màn xuất/PDF (chỉ app).
      - ExportKit.swift
      - ExportViews.swift
      # L-2026-11-20-42: bảo vệ ảnh gốc — kho an toàn ở
      # Application Support/OriginalVault + kiểm kê mỗi lần
      # mở app (planner thuần vào harness như ReceiptLogic;
      # phần keo SwiftData bọc #if canImport(UIKit)). Chỉ
      # target chính như DriveSync — bench không liên kết.
      - ImageIntegrity.swift
      - CardsView.swift
      # A12(i) (vòng 2): onboarding 3 bước (chỉ target app).
      - Onboarding.swift
      - DesignSystem.swift
      # --- Tập module đường đọc v3 (Pha 0-3, dùng CHUNG với
      # target SoHoaDonBench ở dưới — luật 1.6: một nguồn duy
      # nhất, không fork). Parser.swift là bản Pha 3 (M6+M8 đã
      # tách Reconcile.swift riêng). ---
      - Money.swift
      - ReadDiagnostics.swift
      - CaptureIntake.swift
      - OCREngine.swift
      - LineAssembly.swift
      - VendorData.swift
      - Parser.swift
      - Candidates.swift
      - Arbiter.swift
      - ItemCandidates.swift
      - Reconcile.swift
      - RegionReReader.swift
      - ReadPipeline.swift
      # PHA 2 (L-2026-11-21-47): hạ cánh bằng thuế — lõi thuần +
      # bảng hạt giống (cả app lẫn harness biên dịch), cài đặt +
      # hồ sơ tiệm (chỉ app).
      - TaxLanding.swift
      - TaxSeed.swift
      - TaxSettings.swift
      - StoreProfiles.swift
      # A10 (vòng 2): nét tiệm vượt v1 — lõi thuần (harness cũng
      # biên dịch); chỉ GỢI Ý, JSON trong Application Support.
      - StoreTraits.swift
      # --- Dữ liệu bundle của M7 (tiệm) + DomainCorrection ---
      - vendors.json
      - lexicon.json
      - quality-thresholds.json
      # --- Icon app (GL-Keeper, 2026-11-13) ---
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nje.sohoadon
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # V4-4 (D-V4-3 + DESIGN-V4 §8.2): đường đọc v3
        # (parse/parseSams/parseGeneric + engine đối chiếu
        # của F5) bị biên dịch LOẠI khỏi BẢN GIAO bằng điều
        # kiện này — nguồn giữ nguyên một bản duy nhất (§0/§8.1).
        # CHỈ target app khai; target bench ở dưới và project
        # harness KHÔNG khai nên vẫn biên dịch đủ đường v3
        # làm làn đối chứng đo. Kiểm chứng ở bản giao: soi
        # symbol trong IPA (kế hoạch ở v4-4/BINARY-CHECK.md).
        # GLKEEPER_APP (Pha 2, L-2026-11-22-48): dấu target app
        # cho các tiện ích CHỈ có ở target app (DiagLog trong
        # Diagnostics.swift) khi file dùng chung (vd ReadPipeline)
        # cần gọi qua cầu #if — bench + harness KHÔNG khai cả
        # hai dấu này.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GLKEEPER_V4_ONLY GLKEEPER_APP
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "GL-Keeper"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "App dùng camera để chụp hoá đơn giấy và đọc thông tin trên hoá đơn ngay trên máy."
        NSFaceIDUsageDescription: "App dùng Face ID để khoá sổ hoá đơn của anh; tắt được trong mục Cài đặt của app."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # P2-2: scheme callback OAuth Google = client ID đảo
        # ngược theo từng thành phần (DriveConfig.oauthClientID
        # trong DriveSync.swift sinh đúng chuỗi này ở
        # callbackScheme) — HAI CHỖ PHẢI KHỚP NHAU. ĐÃ ĐIỀN
        # client ID thật 2026-11-20 (Google Cloud project
        # gl-keeper, client iOS gắn bundle com.nje.sohoadon).
        CFBundleURLTypes:
          - CFBundleURLName: "Google OAuth (GL-Keeper)"
            CFBundleURLSchemes:
              - com.googleusercontent.apps.743860596620-rn97516fmivkoa2njklujbda55scsbv2
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Hoá đơn nạp vào GL-Keeper"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.image
  # ==========================================================
  # BenchShell (Pha 4): app ĐO dùng chung ĐÚNG tập module ở
  # trên + hai file vỏ riêng (BenchApp/BenchView). KHÔNG liên
  # kết tầng app (Models/ScanView/ReceiptViews/...) — module
  # phải đứng độc lập được; đây cũng là phép kiểm sống của
  # luật 1.6 ở cổng CI. Bundle riêng như tiền lệ bench.
  # deploymentTarget 26.0 (như project bench tiền lệ) vì vỏ đo
  # chạm họ documents iOS 26; tập module tự nó tương thích 17.0.
  # ==========================================================
  SoHoaDonBench:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - BenchApp.swift
      - BenchView.swift
      # G5 / Gate D: vỏ tự kiểm một chạm (chỉ bench — app chính
      # không liên kết) + hai file tầng app thuần Foundation mà
      # khối vòng đời của nó cần (kho nháp/kho chặn của G1/G3 và
      # logic điều kiện của G1; cả hai vốn đã ở target chính +
      # harness, nay thêm vào bench để BenchShell gieo/đối
      # chiếu trạng thái thật thay vì dựng bản sao).
      - BenchSelfCheck.swift
      - PendingDraft.swift
      - ReceiptLogic.swift
      - bench-gt.json
      - Money.swift
      - ReadDiagnostics.swift
      - CaptureIntake.swift
      - OCREngine.swift
      - LineAssembly.swift
      - VendorData.swift
      - Parser.swift
      - Candidates.swift
      - Arbiter.swift
      - ItemCandidates.swift
      - Reconcile.swift
      - RegionReReader.swift
      - ReadPipeline.swift
      # PHA 2: lõi thuế thuần mà ReadPipeline tham chiếu (bench
      # không gói TaxSettings/StoreProfiles — không truyền context).
      - TaxLanding.swift
      - TaxSeed.swift
      - vendors.json
      - lexicon.json
      - quality-thresholds.json
      - BenchImages/C-003.jpg
      - BenchImages/L-R01.jpg
      - BenchImages/L-R02.jpg
      - BenchImages/L-R03.jpg
      - BenchImages/L-R04.jpg
      - BenchImages/L-R05.jpg
      - BenchImages/L-R06.jpg
      - BenchImages/L-R07.jpg
      - BenchImages/L-R08.jpg
      - BenchImages/L-R09.jpg
      - BenchImages/L-R10.jpg
      - BenchImages/L-R11.jpg
      - BenchImages/N-001.jpg
      - BenchImages/N-002.jpg
      - BenchImages/S-0.jpg
      - BenchImages/SYN-001-BLUR.jpg
      - BenchImages/SYN-001-DOWNSCALE.jpg
      - BenchImages/SYN-001-LIGHT.jpg
      - BenchImages/SYN-001-NOISE.jpg
      - BenchImages/SYN-001-TILT.jpg
      - BenchImages/SYN-001-WRINKLE.jpg
      - BenchImages/SYN-002-BLUR.jpg
      - BenchImages/SYN-002-DOWNSCALE.jpg
      - BenchImages/SYN-002-LIGHT.jpg
      - BenchImages/SYN-002-NOISE.jpg
      - BenchImages/SYN-002-TILT.jpg
      - BenchImages/SYN-002-WRINKLE.jpg
      - BenchImages/SYN-003-BLUR.jpg
      - BenchImages/SYN-003-DOWNSCALE.jpg
      - BenchImages/SYN-003-LIGHT.jpg
      - BenchImages/SYN-003-NOISE.jpg
      - BenchImages/SYN-003-TILT.jpg
      - BenchImages/SYN-003-WRINKLE.jpg
      - BenchImages/WR-bestbuy-1.jpg
      - BenchImages/WR-cvs-1.jpg
      - BenchImages/WR-dollartree-1.jpg
      - BenchImages/WR-mcdonalds-1.jpg
      - BenchImages/WR-shell-1.jpg
      - BenchImages/WR-starbucks-1.jpg
      - BenchImages/WR-target-1.jpg
      - BenchImages/WR-traderjoes-1.jpg
      - BenchImages/WR-walgreens-1.jpg
      - BenchImages/WR-wendys-1.jpg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nje.sohoadon.bench
        INFOPLIST_FILE: Info-Bench.plist
        TARGETED_DEVICE_FAMILY: "1"
    # Info.plist RIÊNG cho bench: nếu dùng chung path "Info.plist"
    # với target chính, XcodeGen sinh file hai lần vào cùng một
    # đường và bản sinh sau ghi đè bản trước (mất chuỗi quyền của
    # app chính). Đây là lệch bắt buộc so với tiền lệ một-target.
    info:
      path: Info-Bench.plist
      properties:
        CFBundleDisplayName: "BenchApp — Đo OCR"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
